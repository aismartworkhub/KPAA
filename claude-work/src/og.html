<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<!-- 미리보기 이미지 틀(1200x630). 이중 중괄호 자리표시와 오른쪽 카드를 교안 주제에 맞게 바꾼 뒤 scripts/make_og.mjs로 렌더링.
     렌더링 후 반드시 눈으로 확인: 제목·설명이 단어 중간에서 끊기면 원하는 자리에 <br>을 넣거나 글자 크기를 줄인다. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif;
  background:linear-gradient(135deg,#081536 0%,#0b1f4b 55%,#1d3a7a 115%);color:#fff;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 18%,rgba(201,162,75,.26),transparent 44%)}
.l{position:absolute;left:70px;top:68px;width:660px}
.eb{display:inline-block;padding:8px 20px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);border-radius:999px;font-size:21px;font-weight:700}
h1{font-size:56px;font-weight:900;line-height:1.18;letter-spacing:-.03em;margin:28px 0 22px}
h1 em{font-style:normal;color:#e8cd8a}
p{font-size:26px;color:rgba(255,255,255,.9);line-height:1.5;word-break:keep-all}
h1{word-break:keep-all}
.tags{position:absolute;left:70px;bottom:60px;display:flex;gap:12px}
.tags span{font-size:21px;font-weight:700;padding:8px 16px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.card{position:absolute;right:60px;top:110px;width:390px;background:#fff;color:#202124;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden;padding:18px}
.card h3{font-size:19px;color:#0b1f4b;margin-bottom:12px}
.card .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee;font-size:17px}
.card .n{width:30px;height:30px;border-radius:50%;background:#e5322d;color:#fff;font:900 16px/30px Arial;text-align:center;flex-shrink:0}
</style></head>
<body>
<div class="l">
  <div class="eb">대한변리사회 회원서비스실 · 실습 교안</div>
  <h1>신고 한 건, 보고·공문까지<br><em>Claude 프로젝트로</em></h1>
  <p>근거만 인용하는 지침, 사례 DB,<br>안내 이미지 틀까지 단계별로 따라 합니다</p>
</div>
<div class="tags"><span>📁 프로젝트 지침</span><span>🗂 사례 DB</span><span>🖼 이미지 틀</span></div>
<div class="card">
  <h3>📁 변리사법 위반 신고 검토</h3>
  <div class="row"><span class="n">1</span>가명 처리 → 검토표</div>
  <div class="row"><span class="n">2</span>보고 메일 · 소명 공문</div>
  <div class="row"><span class="n">3</span>쟁점 비교표 · 유사 사례</div>
</div>
</body></html>
