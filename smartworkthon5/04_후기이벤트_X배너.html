<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>04 워크톤 후기 이벤트 X배너 600×1800mm</title>
<link rel="stylesheet" href="banner.css">
<style>
.canvas{background:var(--yellow);color:var(--navy)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(10,20,51,.10) 2.2px,transparent 2.6px);background-size:30px 30px}
.tag{position:absolute;left:50px;top:180px;display:inline-block;background:var(--navy);color:var(--yellow);font-weight:900;
  font-size:26px;letter-spacing:5px;padding:8px 22px 10px;border-radius:30px}
.kick{position:absolute;left:52px;top:262px;font-size:34px;font-weight:900}
.title{position:absolute;left:46px;top:310px;font-size:146px;line-height:1.04}
.title .b{color:var(--blue)}
.lead{position:absolute;left:50px;top:640px;font-size:40px;font-weight:900;line-height:1.35}
.lead em{font-style:normal;background:linear-gradient(transparent 58%,#fff 58%)}

.gift{position:absolute;right:34px;top:600px;transform:rotate(8deg)}

.steps{position:absolute;left:50px;right:50px;top:800px;display:flex;flex-direction:column;gap:18px}
.s{display:flex;gap:20px;align-items:center;background:#fff;border-radius:26px;padding:22px 24px;border:4px solid var(--navy);box-shadow:8px 8px 0 var(--navy)}
.s .ic{flex:0 0 96px;height:96px;border-radius:22px;background:var(--navy);display:grid;place-items:center}
.s .n{font-family:'Montserrat','Noto Sans KR';font-weight:900;font-size:20px;letter-spacing:2px;color:var(--blue)}
.s h3{font-size:40px;font-weight:900;line-height:1.15}
.s p{font-size:21px;color:#3A4466;margin-top:4px;line-height:1.4}

.hash{position:absolute;left:50px;right:50px;top:1390px;background:var(--navy);color:#fff;border-radius:26px;padding:26px 28px}
.hash .k{font-size:22px;font-weight:700;color:var(--mute)}
.hash .v{font-size:33px;font-weight:900;color:var(--cyan);line-height:1.45;margin-top:6px}

.where{position:absolute;left:50px;right:50px;bottom:118px;height:74px;border-radius:37px;border:4px solid var(--navy);
  display:grid;place-items:center;font-size:28px;font-weight:900}
.foot{color:var(--navy)}
</style></head>
<body>
<div class="canvas">
  <div class="dots"></div>

  <div class="head" style="color:var(--navy)">
    <div class="logo"><b>AISH</b><span>AI SMART<br>WORK HUB</span></div>
    <div class="yr">2026</div>
  </div>

  <div class="tag en">REVIEW EVENT</div>
  <div class="kick">제5회 스마트워크톤</div>
  <div class="title display">후기<br><span class="b">이벤트</span></div>
  <div class="lead">후기 남기고<br><em>선물 받아 가세요!</em></div>

  <svg class="gift" width="165" height="165" viewBox="0 0 100 100">
    <rect x="12" y="40" width="76" height="52" rx="6" fill="#2F5BFF" stroke="#0A1433" stroke-width="4"/>
    <rect x="6" y="28" width="88" height="18" rx="5" fill="#2F5BFF" stroke="#0A1433" stroke-width="4"/>
    <rect x="43" y="28" width="14" height="64" fill="#FF6B5B" stroke="#0A1433" stroke-width="4"/>
    <path d="M50 28 C38 10 22 14 28 24 C32 30 44 29 50 28 C56 29 68 30 72 24 C78 14 62 10 50 28Z" fill="#FF6B5B" stroke="#0A1433" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="86" cy="12" r="4" fill="#fff"/><circle cx="10" cy="16" r="3" fill="#fff"/>
  </svg>

  <div class="steps">
    <div class="s">
      <div class="ic"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#FFD84D" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg></div>
      <div><div class="n en">STEP 01</div><h3>찍고</h3><p>오늘 워크톤 현장을 사진으로 남겨요</p></div>
    </div>
    <div class="s">
      <div class="ic"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#FFD84D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4h16v-4"/></svg></div>
      <div><div class="n en">STEP 02</div><h3>올리고</h3><p>SNS·블로그에 후기를 올려요</p></div>
    </div>
    <div class="s">
      <div class="ic"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#FFD84D" stroke-width="2" stroke-linejoin="round"><rect x="3" y="10" width="18" height="11" rx="1.5"/><path d="M2 7h20v3H2zM12 7v14"/><path d="M12 7C10 3 6 3 7 5.5 8 7 12 7 12 7s4 0 5-1.5C18 3 14 3 12 7z"/></svg></div>
      <div><div class="n en">STEP 03</div><h3>받고</h3><p>운영 데스크에서 인증하면 선물 증정!</p></div>
    </div>
  </div>

  <div class="hash">
    <div class="k">이 해시태그를 꼭 달아 주세요</div>
    <div class="v">#제5회스마트워크톤<br>#스마트워크톤 #AISH</div>
  </div>

  <div class="where">인증은 운영 데스크에서</div>
  <div class="foot">주최 <strong>에이아이스마트워크허브(AISH)</strong></div>
</div>
</body></html>
