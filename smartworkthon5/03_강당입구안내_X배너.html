<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>03 시민청 강당 입구 안내 X배너 600×1800mm</title>
<link rel="stylesheet" href="banner.css">
<style>
/* 밝은 안내판 버전: 실내 조명에서도 멀리서 잘 읽히도록 흰 바탕 */
.canvas{background:#F5F8FF;color:var(--navy)}
.grid{background-image:linear-gradient(rgba(10,20,51,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(10,20,51,.05) 1px,transparent 1px)}
.topband{position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(170deg,var(--navy),var(--navy2));color:#fff;
  clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
.welcome{position:absolute;left:50px;top:180px;font-weight:900;font-size:64px;letter-spacing:6px;color:var(--cyan)}
.wk{position:absolute;left:52px;top:268px;font-size:32px;font-weight:700;color:#fff;opacity:.9}
.title{position:absolute;left:46px;top:322px;font-size:112px;line-height:1.08;color:#fff}
.title .c{font-size:82px}
.title .c{color:var(--yellow)}

.here{position:absolute;left:50px;right:50px;top:690px;display:flex;align-items:center;gap:22px}
.here .pin{flex:0 0 112px;height:112px;border-radius:28px;background:var(--navy);display:grid;place-items:center}
.here .k{font-size:24px;font-weight:700;color:#55607E;letter-spacing:1px}
.here .v{font-size:58px;font-weight:900;line-height:1.15}

.box{position:absolute;left:50px;right:50px;top:870px;border-radius:26px;background:#fff;border:3px solid #DCE4F7;padding:30px 30px 26px}
.box h3{font-size:30px;font-weight:900;display:flex;align-items:center;gap:12px}
.box h3::before{content:"";width:12px;height:32px;border-radius:6px;background:var(--blue)}
.st{display:flex;align-items:center;gap:20px;margin-top:22px}
.st .n{flex:0 0 64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;
  font-family:'Montserrat','Noto Sans KR';font-weight:900;font-size:28px}
.st b{font-size:36px;font-weight:900}
.st span{display:block;font-size:21px;color:#55607E;margin-top:2px}

.time{position:absolute;left:50px;right:50px;top:1300px;border-radius:26px;background:var(--yellow);padding:26px 30px;display:flex;align-items:center;gap:22px}
.time .clk{font-family:'Montserrat','Noto Sans KR';font-weight:900;font-size:62px;line-height:1}
.time p{font-size:28px;font-weight:900;line-height:1.35}
.time p small{display:block;font-size:20px;font-weight:700;color:#4a4a36}

.notes{position:absolute;left:50px;right:50px;top:1480px;font-size:23px;line-height:1.6;color:#3A4466}
.notes li{list-style:none;padding-left:30px;position:relative}
.notes li::before{content:"";position:absolute;left:4px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--cyan)}
.notes b{color:var(--navy)}
.foot{color:var(--navy)}
</style></head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="topband">
    <div class="orb" style="width:520px;height:520px;right:-220px;top:-140px;background:radial-gradient(circle,rgba(45,226,230,.35),transparent 68%)"></div>
  </div>

  <div class="head" style="color:#fff">
    <div class="logo"><b>AISH</b><span>AI SMART<br>WORK HUB</span></div>
    <div class="yr">2026. 11. 20</div>
  </div>

  <div class="welcome en">WELCOME</div>
  <div class="wk">어서 오세요!</div>
  <div class="title display">제5회<br><span class="c">스마트워크톤</span></div>

  <div class="here">
    <div class="pin"><svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#2DE2E6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/></svg></div>
    <div><div class="k">이곳이 행사장입니다</div><div class="v">시민청 강당</div></div>
  </div>

  <div class="box">
    <h3>입장 안내</h3>
    <div class="st"><div class="n">1</div><div><b>접수처에서 이름 확인</b><span>신청하신 이름을 말씀해 주세요</span></div></div>
    <div class="st"><div class="n">2</div><div><b>명찰 받기</b><span>행사 내내 잘 보이게 달아 주세요</span></div></div>
    <div class="st"><div class="n">3</div><div><b>안내에 따라 착석</b><span>참가자·참관객 자리가 나뉘어 있어요</span></div></div>
  </div>

  <div class="time">
    <div class="clk en">10:00</div>
    <p>AI 활용도 평가 시작<small>참가자는 미리 입장해 주세요</small></p>
  </div>

  <ul class="notes">
    <li><b>참관은 무료</b>입니다. 누구나 들어오실 수 있어요.</li>
    <li>행사 중 <b>사진·영상 촬영</b>이 진행됩니다.</li>
  </ul>

  <div class="foot">주최 <strong>에이아이스마트워크허브(AISH)</strong></div>
</div>
</body></html>
