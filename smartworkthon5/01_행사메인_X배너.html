<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>01 행사 메인 X배너 600×1800mm</title>
<link rel="stylesheet" href="banner.css">
<style>
.big5{position:absolute;right:-70px;top:120px;font-family:'Montserrat','Noto Sans KR';font-weight:900;font-size:760px;line-height:1;
  color:transparent;-webkit-text-stroke:3px rgba(45,226,230,.22)}
.ed{position:absolute;left:50px;top:180px;display:inline-block;background:var(--yellow);color:var(--navy);
  font-weight:900;font-size:46px;padding:4px 26px 8px;border-radius:40px}
.title{position:absolute;left:46px;top:262px;font-size:168px;line-height:1.02}
.title .c{color:var(--cyan)}
.entitle{position:absolute;left:52px;top:612px;font-weight:800;font-size:31px;letter-spacing:9.5px;color:var(--cyan)}
.slogan{position:absolute;left:50px;top:675px;font-size:47px;font-weight:700;line-height:1.38}
.slogan em{font-style:normal;color:var(--yellow)}

.info{position:absolute;left:50px;right:50px;top:850px;border-top:3px solid rgba(255,255,255,.35);padding-top:30px}
.info .row{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.info .ic{flex:0 0 66px;height:66px;border-radius:18px;background:rgba(45,226,230,.15);display:grid;place-items:center}
.info .k{font-size:21px;font-weight:700;color:var(--mute);letter-spacing:2px}
.info .v{font-size:52px;font-weight:900;line-height:1.15}
.info .v small{font-size:36px;font-weight:700}

.prog{position:absolute;left:50px;right:50px;top:1095px;display:flex;flex-direction:column;gap:14px}
.card{border-radius:22px;padding:18px 26px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.16)}
.card .tag{font-family:'Montserrat','Noto Sans KR';font-weight:800;font-size:19px;letter-spacing:3px;color:var(--cyan)}
.card h3{font-size:36px;font-weight:900;margin-top:2px}
.card p{font-size:22px;color:var(--mute);margin-top:4px;line-height:1.4}
.card.hl{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
.card.hl .tag{color:var(--blue)} .card.hl p{color:#3a3f55}

.free{position:absolute;left:50px;right:50px;bottom:118px;height:74px;border-radius:40px;border:3px solid var(--cyan);
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:var(--cyan)}
</style></head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="orb" style="width:620px;height:620px;left:-260px;top:900px;background:radial-gradient(circle,rgba(47,91,255,.55),transparent 68%)"></div>
  <div class="orb" style="width:520px;height:520px;right:-230px;top:-160px;background:radial-gradient(circle,rgba(45,226,230,.35),transparent 68%)"></div>
  <div class="big5">5</div>

  <div class="head">
    <img class="logo-img" src="assets/aish_logo_white.svg" alt="AISH AI Smart Work Hub">
    <div class="yr">2026</div>
  </div>

  <div class="ed">제5회</div>
  <div class="title display">스마트<br><span class="c">워크톤</span></div>
  <div class="entitle en">SMART WORKTHON</div>
  <div class="slogan">AI로 <em>일하는 방식</em>을<br>바꾸는 하루</div>

  <div class="info">
    <div class="row">
      <div class="ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2DE2E6" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      <div><div class="k">일시</div><div class="v">2026. 11. 20 <small>(금)</small></div></div>
    </div>
    <div class="row">
      <div class="ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2DE2E6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/></svg></div>
      <div><div class="k">장소</div><div class="v">서울시청 시민청</div></div>
    </div>
  </div>

  <div class="prog">
    <div class="card">
      <div class="tag en">TRACK A · 중고급</div>
      <h3>기업 실무 AI 자동화</h3>
      <p>후원기업의 실제 업무 과제를 AI 자동화로 해결</p>
    </div>
    <div class="card">
      <div class="tag en">TRACK B · 초급</div>
      <h3>AI 스킬 챌린지</h3>
      <p>현장에서 공개되는 시제로 AI 스킬 제작</p>
    </div>
    <div class="card hl">
      <div class="tag en">AI SKILL TEST · 10:00</div>
      <h3>AI 활용도 평가</h3>
      <p>1등 50만원 · 2등 30만원 · 3등 20만원</p>
    </div>
  </div>

  <div class="free">참관 무료 · 누구나 환영합니다</div>
  <div class="foot">주최 <strong>에이아이스마트워크허브(AISH)</strong></div>
</div>
</body></html>
