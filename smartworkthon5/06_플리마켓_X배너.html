<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>06 플리마켓 X배너 600×1800mm</title>
<link rel="stylesheet" href="banner.css">
<style>
/* 상단 차양(어닝): 줄무늬 75mm 간격 */
.awning{position:absolute;left:0;right:0;top:0;height:110px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 75px,#fff 75px 150px)}
.scallop{position:absolute;left:0;right:0;top:110px;height:38px;
  background:radial-gradient(circle at 37.5px 0,var(--yellow) 37px,transparent 37.5px) 0 0/150px 38px repeat-x,
             radial-gradient(circle at 37.5px 0,#fff 37px,transparent 37.5px) 75px 0/150px 38px repeat-x}
.head{top:190px}
.tag{position:absolute;left:50px;top:318px;display:inline-block;background:var(--coral);color:#fff;font-weight:900;font-size:26px;
  letter-spacing:6px;padding:7px 22px 10px;border-radius:28px}
.kick{position:absolute;left:52px;top:384px;font-size:31px;font-weight:700;color:var(--mute)}
.title{position:absolute;left:46px;top:430px;font-size:100px;line-height:1.08}
.title .y{color:var(--yellow);font-size:122px}
.lead{position:absolute;left:50px;top:690px;font-size:40px;font-weight:900;line-height:1.38}
.lead em{font-style:normal;color:var(--cyan)}

.cards{position:absolute;left:50px;right:50px;top:840px;display:flex;flex-direction:column;gap:18px}
.ic{display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);
  border-radius:26px;padding:20px 24px 20px 20px}
.ic i{flex:0 0 104px;height:104px;border-radius:50%;display:grid;place-items:center}
.ic b{display:block;font-size:44px;font-weight:900;line-height:1.15}
.ic small{display:block;font-size:23px;color:var(--mute);margin-top:4px}

.info{position:absolute;left:50px;right:50px;top:1352px;border-top:3px solid rgba(255,255,255,.35);padding-top:28px}
.info .row{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.info .ib{flex:0 0 66px;height:66px;border-radius:18px;background:rgba(255,216,77,.16);display:grid;place-items:center}
.info .k{font-size:21px;font-weight:700;color:var(--mute);letter-spacing:2px}
.info .v{font-size:48px;font-weight:900;line-height:1.15}
.info .v small{font-size:34px;font-weight:700}

.free{position:absolute;left:50px;right:50px;bottom:118px;height:74px;border-radius:37px;background:var(--yellow);color:var(--navy);
  display:grid;place-items:center;font-size:30px;font-weight:900}
</style></head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="orb" style="width:640px;height:640px;left:-280px;top:760px;background:radial-gradient(circle,rgba(47,91,255,.5),transparent 68%)"></div>
  <div class="orb" style="width:520px;height:520px;right:-240px;top:300px;background:radial-gradient(circle,rgba(255,107,91,.22),transparent 68%)"></div>
  <div class="awning"></div><div class="scallop"></div>

  <div class="head">
    <img class="logo-img" src="assets/aish_logo_white.svg" alt="AISH AI Smart Work Hub">
    <div class="yr">2026</div>
  </div>

  <div class="tag en">FLEA MARKET</div>
  <div class="kick">제5회 스마트워크톤과 함께하는</div>
  <div class="title display">스마트워크<br><span class="y">플리마켓</span></div>
  <div class="lead">구경하고, 체험하고,<br><em>득템하세요!</em></div>

  <div class="cards">
    <div class="ic"><i style="background:var(--yellow)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#0A1433" stroke-width="2.2" stroke-linecap="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></i>
      <div><b>구경</b><small>다양한 상품을 둘러보세요</small></div></div>
    <div class="ic"><i style="background:var(--cyan)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#0A1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.5a1.6 1.6 0 0 1 2.4-2.1L9 15"/></svg></i>
      <div><b>체험</b><small>직접 써 보고 물어보세요</small></div></div>
    <div class="ic"><i style="background:var(--coral)"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></i>
      <div><b>득템</b><small>마음에 들면 바로 구매!</small></div></div>
  </div>

  <div class="info">
    <div class="row">
      <div class="ib"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFD84D" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      <div><div class="k">일시</div><div class="v">2026. 11. 20 <small>(금)</small></div></div>
    </div>
    <div class="row">
      <div class="ib"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FFD84D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/></svg></div>
      <div><div class="k">장소</div><div class="v">서울시청 시민청</div></div>
    </div>
  </div>

  <div class="free">누구나 자유롭게 둘러보세요!</div>
  <div class="foot">주최 <strong>에이아이스마트워크허브(AISH)</strong></div>
</div>
</body></html>
