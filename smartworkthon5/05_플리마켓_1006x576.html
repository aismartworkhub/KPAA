<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>05 플리마켓 배너 1006×576</title>
<link rel="stylesheet" href="banner.css">
<style>
.canvas{width:1006px;height:576px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%)}
/* 상단 차양(어닝) 줄무늬 */
.awning{position:absolute;left:0;right:0;top:0;height:92px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 71.857px,#fff 71.857px 143.714px)}
.scallop{position:absolute;left:0;right:0;top:92px;height:36px;
  background:radial-gradient(circle at 35.93px 0,var(--yellow) 35.5px,transparent 36px) 0 0/143.714px 36px repeat-x,
             radial-gradient(circle at 35.93px 0,#fff 35.5px,transparent 36px) 71.857px 0/143.714px 36px repeat-x}
.tag{position:absolute;left:60px;top:152px;display:inline-block;background:var(--coral);color:#fff;font-weight:900;font-size:22px;
  letter-spacing:5px;padding:6px 18px 8px;border-radius:24px}
.kick{position:absolute;left:62px;top:204px;font-size:24px;font-weight:700;color:var(--mute)}
.title{position:absolute;left:56px;top:238px;font-size:96px;line-height:1.0}
.title .y{color:var(--yellow)}
.lead{position:absolute;left:60px;top:438px;font-size:29px;font-weight:900}
.lead em{font-style:normal;color:var(--cyan)}
.info{position:absolute;left:60px;bottom:34px;display:flex;gap:12px}
.info span{font-size:20px;font-weight:700;border:2px solid rgba(255,255,255,.4);border-radius:20px;padding:4px 16px 6px}

.icons{position:absolute;right:56px;top:160px;display:flex;flex-direction:column;gap:12px}
.ic{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);
  border-radius:22px;padding:11px 22px 11px 12px;width:320px}
.ic i{flex:0 0 64px;height:64px;border-radius:50%;display:grid;place-items:center}
.ic b{display:block;font-size:28px;font-weight:900}
.ic small{display:block;font-size:17px;color:var(--mute);margin-top:2px}
.foot.flogo{left:auto;right:56px;bottom:30px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}
.flogo img{height:52px;display:block}
</style></head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="orb" style="width:520px;height:520px;left:260px;top:220px;background:radial-gradient(circle,rgba(47,91,255,.45),transparent 68%)"></div>
  <div class="awning"></div><div class="scallop"></div>

  <div class="tag en">FLEA MARKET</div>
  <div class="kick">제5회 스마트워크톤과 함께하는</div>
  <div class="title display">스마트워크<br><span class="y">플리마켓</span></div>
  <div class="lead">구경하고, 체험하고, <em>득템하세요!</em></div>
  <div class="info"><span>2026. 11. 20 (금)</span><span>G밸리 기업시민청</span></div>

  <div class="icons">
    <div class="ic"><i style="background:var(--yellow)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0A1433" stroke-width="2.2" stroke-linecap="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></i>
      <div><b>구경</b><small>다양한 상품을 둘러보세요</small></div></div>
    <div class="ic"><i style="background:var(--cyan)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0A1433" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.5a1.6 1.6 0 0 1 2.4-2.1L9 15"/></svg></i>
      <div><b>체험</b><small>직접 써 보고 물어보세요</small></div></div>
    <div class="ic"><i style="background:var(--coral)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></i>
      <div><b>득템</b><small>마음에 들면 바로 구매!</small></div></div>
  </div>

  <div class="foot flogo"><span>주최</span><img src="assets/aish_logo_white.svg" alt="AISH AI Smart Work Hub"></div>
</div>
</body></html>
