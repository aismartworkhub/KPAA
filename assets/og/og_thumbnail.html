<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<!-- 정책홍보실 통합 교안(루트 index.html) 카카오톡·SNS 미리보기 원본. 렌더링: node assets/og/make_og.mjs -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:'Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif;
  background:linear-gradient(135deg,#081536 0%,#0b1f4b 55%,#1d3a7a 115%);color:#fff;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 12%,rgba(201,162,75,.28),transparent 42%)}
.l{position:absolute;left:70px;top:66px;width:620px}
.eb{display:inline-block;padding:8px 20px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);border-radius:999px;font-size:21px;font-weight:700}
h1{font-size:60px;font-weight:900;line-height:1.18;letter-spacing:-.03em;margin:28px 0 22px}
h1 em{font-style:normal;color:#e8cd8a}
p{font-size:27px;color:rgba(255,255,255,.9);line-height:1.5}
.foot{position:absolute;left:70px;bottom:58px;display:flex;gap:12px}
.foot span{font-size:21px;font-weight:700;padding:8px 16px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.stack{position:absolute;right:58px;top:58px;width:420px;display:flex;flex-direction:column;gap:14px}
.grp{background:#fff;color:#15181d;border-radius:16px;padding:16px 18px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.grp h3{font-size:19px;font-weight:900;color:#0b1f4b;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.grp h3 small{font-size:14px;font-weight:800;color:#8a6f2e;background:#faf4e4;border-radius:6px;padding:2px 8px}
.row{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:15.5px;font-weight:700;padding:5px 10px;border-radius:8px;border-left:5px solid var(--c);background:#f3f5f7}
</style></head>
<body>
<div class="l">
  <div class="eb">대한변리사회 정책홍보실 · AI 업무혁신 교육</div>
  <h1>정책홍보실<br><em>AI 업무혁신 통합 교안</em></h1>
  <p>회원이 체감하는 변화,<br>내 업무 자료로 직접 만듭니다</p>
</div>
<div class="foot"><span>📚 커리큘럼</span><span>🛠 실습</span><span>🧩 모듈</span></div>
<div class="stack">
  <div class="grp"><h3>커리큘럼<small>기본 5회 + 심화</small></h3>
    <div class="row">
      <span class="chip" style="--c:#a07c22">이미지·통일 템플릿</span>
      <span class="chip" style="--c:#1f5793">보도자료 작성</span>
      <span class="chip" style="--c:#a2447e">IP 브리핑</span>
      <span class="chip" style="--c:#1f8497">입법동향·성과</span>
      <span class="chip" style="--c:#34465f">노션 DB</span>
    </div></div>
  <div class="grp"><h3>실습<small>2종</small></h3>
    <div class="row">
      <span class="chip" style="--c:#a07c22">캔바 매직 레이어</span>
      <span class="chip" style="--c:#a2447e">클로드 × 어도비</span>
    </div></div>
  <div class="grp"><h3>보도자료 마스터<small>모듈 A–D</small></h3>
    <div class="row">
      <span class="chip" style="--c:#1f5793">기사형 콘텐츠</span>
      <span class="chip" style="--c:#1f5793">모의 데스크</span>
      <span class="chip" style="--c:#1f5793">이슈 레이더</span>
      <span class="chip" style="--c:#1f5793">프롬프트 설계</span>
    </div></div>
</div>
</body></html>
